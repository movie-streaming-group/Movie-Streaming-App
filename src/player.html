
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div id="player"></div>

    <script>
        window.streamBoxReady = false;
        window.streamBoxError = false;

        var player;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";

        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {

            player = new YT.Player('player', {

                videoId: '%VIDEO_ID%',

                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    rel: 0,
                    playsinline: 1,
                    modestbranding: 1
                },

                events: {
                    onReady: function(event) {
                        window.streamBoxReady = true;
                        event.target.playVideo();
                    },

                    onError: function(event) {
                        window.streamBoxError = true;
                    }
                }
            });
        }
    </script>

</body>
</html>
