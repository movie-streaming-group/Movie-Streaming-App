
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="player"></div>

<script>
    window.streamBoxReady = false;
    window.streamBoxError = false;

    var player;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {

        player = new YT.Player('player', {
            width: '100%',
            height: '100%',
            videoId: '%VIDEO_ID%',

            playerVars: {
                autoplay: 1,
                controls: 0,
                rel: 0,
                playsinline: 1
            },

            events: {
                onReady: function(event) {
                    window.streamBoxReady = true;
                    event.target.playVideo();
                },

                onError: function(event) {
                    window.streamBoxError = true;
                }
            }
        });
    }

    // Playback controls
    function streamBoxPlay() {
        if (player) player.playVideo();
    }

    function streamBoxPause() {
        if (player) player.pauseVideo();
    }

    function streamBoxSeekBy(seconds) {
        if (player) {
            var current = player.getCurrentTime();
            var duration = player.getDuration();

            player.seekTo(
                Math.max(0, Math.min(duration, current + seconds)),
                true
            );
        }
    }

    function streamBoxSeekTo(seconds) {
        if (player) {
            player.seekTo(seconds, true);
        }
    }

    function streamBoxSetVolume(volume) {
        if (player) {
            player.setVolume(volume);
        }
    }

    function streamBoxToggleMute() {
        if (!player) return false;

        if (player.isMuted()) {
            player.unMute();
            return false;
        } else {
            player.mute();
            return true;
        }
    }

    function streamBoxGetCurrentTime() {
        return player ? player.getCurrentTime() : 0;
    }

    function streamBoxGetDuration() {
        return player ? player.getDuration() : 0;
    }
</script>

</body>
</html>
